<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="container">
      <div class="nav">
        <h1>JavaScript Learning</h1>
        <h3>Materi object & Array</h3>
        <hr />
      </div>
      <div class="main">
        <div class="box">
          <h4>Papan Score Pingpong</h4>
          <div class="row">
            <div class="col-player">
              <label for="">Player 1</label><br />
              <input type="text" id="player1" placeholder="Nama Pemain" />
              <label for=""></label><br /><br />
              <input
                type="number"
                name="score1"
                id="score1"
                placeholder="Score"
              /><br />
            </div>
            <div class="col-score">
              <label for="">Player2</label><br />
              <input type="text" id="player2" placeholder="Nama Pemain" />
              <label for=""></label><br /><br />
              <input
                type="number"
                name="score2"
                id="score2"
                placeholder="Score"
              />
            </div>
          </div>
          <button type="button" class="btn-click" onclick="tambahGame()">
            Simpan Game
          </button>
        </div>
        <div class="box">
          <div class="riwayat">
            <h4>Hasil Point</h4>
            <p id="hasil"></p>
          </div>
        </div>
      </div>
    </div>
    <script src="js/lat.js"></script>
  </body>
</html>
